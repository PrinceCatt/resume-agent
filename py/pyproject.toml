[project]
name = "resume-agent-py"
version = "0.2.0"
description = "Python port of the resume-agent backend: same routes, JSON shapes, SSE events and SQLite schema as server/ (TypeScript)."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "aiohttp>=3.11",
  "playwright>=1.50",
  "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
